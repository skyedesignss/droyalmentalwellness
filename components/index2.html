<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Droyal Mental Wellness | Coming Soon</title>
  <meta name="description" content="Droyal Mental Wellness is preparing a new website. We are here to help.">

  <style>
    :root {
      --navy: #172b4d;
      --green: #285943;
      --gold: #c9a227;
      --light: #f7f8f5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: var(--light);
      color: var(--navy);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      padding: 60px 30px;
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(23, 43, 77, 0.08);
    }

    .brand {
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    h1 span {
      color: var(--green);
    }

    p {
      max-width: 520px;
      margin: 0 auto 30px;
      color: #5d6875;
      font-size: 17px;
      line-height: 1.7;
    }

    .contact {
      display: inline-block;
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 4px;
    }

    .tagline {
      margin-top: 35px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="brand">Droyal Mental Wellness</div>

    <h1>
      Our new website is<br>
      <span>coming soon.</span>
    </h1>

    <p>
      We are currently preparing our new website.
      Droyal Mental Wellness is committed to compassionate
      care and meaningful support for individuals and families.
    </p>

    <a class="contact" href="mailto:info@droyalmentalwellness.org">
      info@droyalmentalwellness.org
    </a>

    <div class="tagline">We Are Here To Help.</div>
  </main>

</body>
</html>
